[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "document-analyzer"
version = "0.2.0"
description = "AI-powered CLI that clusters and organizes files by content similarity"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
dependencies = [
    "pandas==3.0.5",
    "scikit-learn==1.9.0",
    "yake==0.7.3",
    "onnxruntime==1.32.0",
    "tokenizers==0.23.3",
    "huggingface_hub==2.4.0",
    "numpy==2.5.1",
    "pypdf==7.1.1",
    "chardet==7.5.1",
]

[project.optional-dependencies]
audio = ["tinytag", "vosk"]
viz = ["matplotlib"]

[project.scripts]
organize-files = "document_analyzer.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
document_analyzer = ["ui.html"]
