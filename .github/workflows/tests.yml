name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # numpy 2.5 (pinned in requirements.txt) has no Python 3.11 wheels.
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.12"]
        include:
          - os: ubuntu-latest
            python-version: "3.13"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m unittest discover tests

  # Runs the real embedding model on examples/demo (tests/test_quality.py).
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          # Cache keys are immutable: a new key per model file/revision, or the
          # job would download the model on every run.
          key: hf-e5-small-onnx-614241f622f53c4eeff9890bdc4f31cfecc418b3
      - run: pip install -r requirements.txt
      - run: python -m unittest tests.test_quality -v
        env:
          RUN_QUALITY: "1"
