name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # numpy 2.5 (pinned in requirements.txt) has no Python 3.11 wheels.
          python-version: "3.12"
          cache: pip
      # CPU-only torch: the PyPI build drags in ~14 CUDA packages the tests never use.
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -r requirements.txt
      - run: python -m unittest discover tests
