name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # numpy 2.5 (pinned in requirements.txt) has no Python 3.11 wheels.
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.12"]
        include:
          - os: ubuntu-latest
            python-version: "3.13"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      # CPU-only torch: the default Linux/Windows build drags in CUDA
      # packages the tests never use. macOS wheels are CPU-only already.
      - if: runner.os != 'macOS'
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -r requirements.txt
      - run: python -m unittest discover tests

  # Runs the real embedding model on examples/demo (tests/test_quality.py).
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-intfloat-multilingual-e5-small
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -r requirements.txt
      - run: python -m unittest tests.test_quality -v
        env:
          RUN_QUALITY: "1"
